[platformio]
default_envs = teensy41_native_101
core_dir = ../build/pio-core

[env:teensy36_diagnostic]
platform = teensy@6.0.0
board = teensy36
framework = arduino
board_build.f_cpu = 180000000L
build_flags =
    -D USB_MIDI_SERIAL
    -I ../core
    -I ../reference
    -I ../build/fixtures
build_src_filter =
    +<main.cpp>
    +<native_filter_kernel.cpp>
upload_protocol = teensy-cli
monitor_speed = 115200

# Recovery image used to distinguish a boot/framework/USB problem from a
# fault in the native oracle.  It has no C++ kernel, MIDI, or fixture code.
[env:teensy36_recovery_led]
platform = teensy@6.0.0
board = teensy36
framework = arduino
board_build.f_cpu = 180000000L
build_flags =
    -D NMM_RECOVERY_LED
    -D USB_SERIAL
build_src_filter = +<main.cpp>
upload_protocol = teensy-cli
monitor_speed = 115200

[env:teensy36_native_101]
platform = teensy@6.0.0
board = teensy36
framework = arduino
board_build.f_cpu = 180000000L
build_flags =
    -D USB_MIDI_SERIAL
    -I ../core
    -I ../mcu
    -I ../reference
    -I ../build/reference-a
    -I ../build/fixtures
build_src_filter =
    +<native_main.cpp>
    +<native_graph_kernel.cpp>
upload_protocol = teensy-cli
monitor_speed = 115200

[env:teensy41_native_101]
extends = env:teensy36_native_101
board = teensy41
board_build.f_cpu = 600000000L
